<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Открыть Альфа-Банк в Яндекс Браузере</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f5f7;
        color: #171717;
      }

      main {
        width: min(420px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 32px 24px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgb(0 0 0 / 10%);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: #666;
        line-height: 1.5;
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        background: #ffcc00;
        color: #171717;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      button:active {
        transform: translateY(1px);
      }

      .fallback-link {
        display: inline-block;
        margin-top: 16px;
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Альфа-Банк</h1>
      <p>Откройте сайт в Яндекс Браузере.</p>

      <button type="button" id="open-button">
        Открыть в Яндекс Браузере
      </button>

      <a class="fallback-link" href="https://alfabank.ru/">
        Открыть обычную ссылку
      </a>
    </main>

    <script>
      (() => {
        const targetUrl = "https://alfabank.ru/";
        const fallbackDelay = 1600;
        const openButton = document.getElementById("open-button");

        function isIOS() {
          return /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        }

        function isAndroid() {
          return /Android/i.test(navigator.userAgent);
        }

        function openInYandex() {
          let fallbackTimer;

          const cancelFallback = () => {
            window.clearTimeout(fallbackTimer);
            document.removeEventListener("visibilitychange", onVisibilityChange);
            window.removeEventListener("pagehide", cancelFallback);
          };

          const onVisibilityChange = () => {
            if (document.hidden) {
              cancelFallback();
            }
          };

          document.addEventListener("visibilitychange", onVisibilityChange);
          window.addEventListener("pagehide", cancelFallback, { once: true });

          fallbackTimer = window.setTimeout(() => {
            cancelFallback();
            window.location.assign(targetUrl);
          }, fallbackDelay);

          if (isIOS()) {
            window.location.href = "yandexbrowser-open-url://" + encodeURIComponent(targetUrl);
            return;
          }

          if (isAndroid()) {
            window.location.href =
              "intent://alfabank.ru/#Intent;scheme=https;package=com.yandex.browser;end";
            return;
          }

          cancelFallback();
          window.location.assign(targetUrl);
        }

        openButton.addEventListener("click", openInYandex);
      })();
    </script>
  </body>
</html>
