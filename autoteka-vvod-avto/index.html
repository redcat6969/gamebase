<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ввод авто — Автотека</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen" data-name="Ввод авто">
    <div class="screen__hero-bg" aria-hidden="true"></div>
    <div class="hero-panel">
      <header class="hero-panel__header">
        <div class="status-bar" aria-hidden="true">
          <span class="status-bar__time">12:22</span>
          <img
            src="https://www.figma.com/api/mcp/asset/d1cb3be1-53dc-46a8-bf34-a53df3cefaf8"
            alt=""
            width="14"
            height="14"
            class="status-bar__location"
          />
          <div class="status-bar__icons">
            <img
              class="status-bar__signal"
              src="https://www.figma.com/api/mcp/asset/4217f327-94c1-4e99-916f-3ce6bee2d249"
              alt=""
              width="21"
              height="14"
            />
            <img
              class="status-bar__wifi"
              src="https://www.figma.com/api/mcp/asset/0355235d-46d6-457b-b761-4b0bc9ac1081"
              alt=""
              width="15"
              height="14"
            />
            <img
              class="status-bar__battery"
              src="https://www.figma.com/api/mcp/asset/2d1fc644-6b30-4f5c-9135-7a7330705819"
              alt=""
              width="32"
              height="14"
            />
          </div>
        </div>

        <nav class="nav-bar" aria-label="Основная навигация">
          <button type="button" class="nav-bar__btn nav-bar__btn--back" aria-label="Назад">
            <img src="https://www.figma.com/api/mcp/asset/0110494f-3c07-43da-bace-3eba03786dae" alt="" width="18" height="19" />
          </button>
          <div class="nav-bar__center" aria-hidden="true"></div>
          <div class="nav-bar__right">
            <button type="button" class="nav-bar__btn" aria-label="Справка">
              <img src="https://www.figma.com/api/mcp/asset/407b306d-1839-4b47-9839-9a114ec302e9" alt="" width="18" height="18" />
            </button>
          </div>
        </nav>
      </header>

      <section class="hero-card" aria-labelledby="hero-title">
        <div class="hero-card__inner">
          <img
            src="https://www.figma.com/api/mcp/asset/bd16e0b6-7c8e-4767-95ff-66f2c9649138"
            alt="Автотека"
            width="48"
            height="48"
            class="hero-card__logo"
          />
          <h1 id="hero-title" class="hero-card__title">51 отчет</h1>
          <p class="hero-card__subtitle">
            Используйте их до 31 февраля — <br />
            потом отчёты сгорят.
          </p>
        </div>

        <div class="hero-card__spacer" aria-hidden="true"></div>

        <div class="hero-card__actions">
          <button type="button" class="btn btn--primary">Запросить</button>
        </div>
      </section>
    </div>

    <main>
      <section class="report-section" aria-labelledby="report-heading">
        <div class="report-section__spacer-top" aria-hidden="true"></div>
        <h2 id="report-heading" class="report-section__heading">Что входит в отчет?</h2>

        <div class="report-section__body">
          <ul class="feature-list">
            <li class="feature-list__item">
              <span class="feature-list__icon" aria-hidden="true">
                <img src="https://www.figma.com/api/mcp/asset/24f3bf58-01dd-4c0a-81e6-385fe5e62d91" alt="" width="16" height="16" />
              </span>
              <div class="feature-list__text">
                <span class="feature-list__title">ДТП и повреждения</span>
                <span class="feature-list__desc">Включая те, о которых не сообщали в ГИБДД</span>
              </div>
            </li>
            <li class="feature-list__item">
              <span class="feature-list__icon" aria-hidden="true">
                <img src="https://www.figma.com/api/mcp/asset/24f3bf58-01dd-4c0a-81e6-385fe5e62d91" alt="" width="16" height="16" />
              </span>
              <div class="feature-list__text">
                <span class="feature-list__title">Пробег</span>
                <span class="feature-list__desc">И история скруток, если были</span>
              </div>
            </li>
            <li class="feature-list__item">
              <span class="feature-list__icon" aria-hidden="true">
                <img src="https://www.figma.com/api/mcp/asset/24f3bf58-01dd-4c0a-81e6-385fe5e62d91" alt="" width="16" height="16" />
              </span>
              <div class="feature-list__text">
                <span class="feature-list__title">Юридические риски</span>
                <span class="feature-list__desc">Залог, розыск и ограничения</span>
              </div>
            </li>
            <li class="feature-list__item feature-list__item--more">
              <span class="feature-list__icon feature-list__icon--more" aria-hidden="true">
                <svg class="feature-list__ellipsis" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" focusable="false">
                  <circle cx="3" cy="8" r="2" fill="currentColor" />
                  <circle cx="8" cy="8" r="2" fill="currentColor" />
                  <circle cx="13" cy="8" r="2" fill="currentColor" />
                </svg>
              </span>
              <p class="feature-list__more-text">И ещё больше 10 пунктов проверки</p>
            </li>
          </ul>
        </div>

        <div class="report-section__footer">
          <button type="button" class="btn btn--secondary btn--full">Открыть пример отчета</button>
        </div>
      </section>
    </main>

    <div class="home-indicator" aria-hidden="true">
      <span class="home-indicator__bar"></span>
    </div>
  </div>
</body>
</html>
